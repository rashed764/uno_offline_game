name: Build Android APK

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Capacitor Android Platform
        run: npx cap add android || true

      - name: Configure Landscape Orientation in AndroidManifest
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("android:screenOrientation")) {
                content = content.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
                fs.writeFileSync(file, content, "utf8");
                console.log("Injected android:screenOrientation=\"sensorLandscape\" into AndroidManifest.xml");
              }
            } else {
              console.log("AndroidManifest.xml not found yet.");
            }
          '

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
